name: Build and deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the per-recipe git dates below are accurate.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean install

      - name: Render recipes
        run: java -jar testbench/target/testbench-1.0-SNAPSHOT.jar recipes recipes-rendered

      # Emit dates.json mapping each recipe page url to its last-commit date,
      # used by the front page to sort by "Senaste" (latest).
      - name: Generate dates.json
        run: |
          echo '{' > recipes-rendered/dates.json
          first=1
          # quotepath=off: without it git escapes non-ASCII names ("Gl\303\266gg...")
          # which then fail the .recipe match, silently dropping every recipe with å/ä/ö.
          git -c core.quotepath=off ls-files recipes | grep '\.recipe$' | while read -r f; do
            url="$(basename "$f").html"
            d=$(git log -1 --date=short --format=%cd -- "$f")
            if [ "$first" -eq 0 ]; then printf ',\n' >> recipes-rendered/dates.json; fi
            first=0
            printf '  "%s": "%s"' "$url" "$d" >> recipes-rendered/dates.json
          done
          printf '\n}\n' >> recipes-rendered/dates.json
          cat recipes-rendered/dates.json

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: recipes-rendered

  deploy:
    # Only main publishes; every other branch just has to compile.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
