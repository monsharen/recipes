<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Recipes</title>
</head>
<body>
    <div class="content">
        <div class="container" id="recipeList">

            <div class="row" style="margin-bottom: 1em">
                <div class="col">
                    <input class="form-control form-control-lg" type="text" placeholder="Filter" aria-label="filter" v-model="search">
                </div>
            </div>

            <div class="row" style="margin-bottom: 1em">
                <div class="col" v-for="(recipeType, index) in recipeTypes" style="flex: 0 0 0%; margin-bottom: 1em">
                    <input type="checkbox" class="btn-check" :id="'recipetype-' + index" :name="recipeType" v-model="checkedRecipeTypes" :value="recipeType" autocomplete="off">
                    <label class="btn btn-outline-primary" :for="'recipetype-' + index">{{recipeType}}</label>
                </div>
            </div>

            <!-- Sort + display-style toggles, on one line just above the list -->
            <div class="row" style="margin-bottom: 1em">
                <div class="col d-flex justify-content-between align-items-center" style="gap: 0.5em; flex-wrap: wrap">
                    <div class="btn-group" role="group" aria-label="Sortering">
                        <button type="button" class="btn btn-outline-primary" :class="{ active: sortBy === 'latest' }" @click="setSort('latest')" aria-label="Sortera efter senaste" title="Senaste">🕒</button>
                        <button type="button" class="btn btn-outline-primary" :class="{ active: sortBy === 'alphabetical' }" @click="setSort('alphabetical')" aria-label="Sortera alfabetiskt" title="Alfabetisk (A–Ö)">🔤</button>
                    </div>
                    <div class="btn-group" role="group" aria-label="Vy">
                        <button type="button" class="btn btn-outline-primary" :class="{ active: viewMode === 'card' }" @click="setView('card')" aria-label="Kortvy" title="Kortvy">▦</button>
                        <button type="button" class="btn btn-outline-primary" :class="{ active: viewMode === 'list' }" @click="setView('list')" aria-label="Listvy" title="Listvy">☰</button>
                    </div>
                </div>
            </div>

            <!-- Card view -->
            <template v-if="viewMode === 'card'">
                <div class="row" v-for="recipe in filteredRecipes">
                    <div class="col">

                        <div class="card mb-3" >
                            <div class="row g-0">

                                <div class="col-md-4">
                                    <img :src="recipe.image" class="img-fluid rounded-start" :alt="recipe.name">
                                </div>
                                <div class="col-md-8">
                                    <div class="card-body">
                                        <h4 class="card-title">{{recipe.name}}</h4>
                                        <p class="card-text">{{recipe.description}}</p>
                                        <p class="card-text" v-if="recipe.servings"><small>Servings: {{recipe.servings}}</small></p>
                                        <p class="card-text" v-if="recipe.estimatedPrepTime"><small>Estimated time: {{recipe.estimatedPrepTime}}</small></p>
                                        <br />
                                        <a :href="recipe.url" class="btn btn-primary">Öppna recept</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Compact list view -->
            <template v-if="viewMode === 'list'">
                <div class="list-group recipe-list">
                    <a v-for="recipe in filteredRecipes" :href="recipe.url" class="list-group-item list-group-item-action recipe-list-item">
                        <img :src="recipe.image" class="recipe-list-thumb" :alt="recipe.name">
                        <span class="recipe-list-name">{{recipe.name}}</span>
                        <span class="recipe-list-meta" v-if="recipe.estimatedPrepTime">{{recipe.estimatedPrepTime}}</span>
                    </a>
                </div>
            </template>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.0.3/vue.js"></script>

    <script type="module" src="recipes.js"></script>
</body>
</html>
